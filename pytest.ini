[pytest]   #选择器
#-m 后面可解表达式，进行运算
addopts = -v -v -s --html=report.html --self-contained-html --alluredir=temps --clean-alluredir  --driver=edge

#在配置文件中进行标记注册
markers =
    api: 接口用例
    web: UI用例
    ut：单元用例
    e2e：端对端用例


# ========== pytest‑result‑log 核心配置 ==========
#日志输出文件路径
log_file =./logs/pytest.log
#日志记录级别
log_file_level=info
#日志内容格式,-8s：-表示左对齐；8表示总宽度占8个字符；s表示字符串输出
log_file_format = %(levelname)-8s %(asctime)s [%(name)s:%(lineno)s] : %(message)s
#日志里面时间格式
log_file_date_format = %Y‑%m‑%d %H:%M:%S

# ;是 **ini 文件注释符号**，代表本行是注释，不生效
;记录用例执行结果
result_log_enable=1
;记录用例分割线
result_log_separator=1
;分割线等级
result_log_level_separator=info
;异常信息等级
result_log_level_verbose=info

#做完UI测试后，提供相应的调试信息，日志，截图，其他信息
selenium_capture_debug=always

